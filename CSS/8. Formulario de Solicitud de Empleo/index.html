<!DOCTYPE html>

<html lang="en">



<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Application Form</title>

    <link rel="stylesheet" href="styles.css" />

</head>



<body>

    <div class="container">

        <h1 class="title">Job Application Form</h1>

        <form>

            <label for="name">Full Name: </label>

            <input type="text" id="name" />

            <label for="email">Email: </label>

            <input type="email" id="email" />

            <label for="position">Position</label>

            <select id="position">

                <option value="Abogado">Abogado</option>

                <option selected value="Contador">Contador</option>

                <option value="Ing.Sistemas">Ing.Sistemas</option>

                <option value="Medico">Medico</option>

            </select>

            <fieldset class="radio-group">

                <legend>Availability</legend>

                <input type="radio" name="availability" id="full-time" />

                <label for="full-time">Full Time</label>

                <input type="radio" name="availability" id="part-time" />

                <label for="part-time">Part Time</label>

            </fieldset>

            <label>Presentación</label>

            <textarea id="message"></textarea>

            <button class="submit-btn" type="submit">Submit Form</button>

        </form>

    </div>

</body>



</html>
