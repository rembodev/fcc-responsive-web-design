<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <ul class="todo-list">
        <li>
            <input type="checkbox" id="mecanografia" />
            <label for="mecanografia">Practicar mecanografía en 1 minuto</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="monkeytype.com" target="_blank">Practicar Mecanografia</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="pomodoro" />
            <label for="pomodoro">Organizar una sesión de trabajo con la técnica Pomodoro</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="pomofocus.io" target="_blank">Pomofocus</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="aprendizaje" />
            <label for="aprendizaje">Aprender un concepto nuevo de programación o ciencia</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="freecodecamp.org/news" target="_blank">FreeCodeCamp</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="contraseñas" />
            <label for="contraseñas">Verificar si tus contraseñas han sido filtradas</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="haveibeenpwned.com" target="_blank">haveibeenpwned</a></li>
            </ul>
        </li>
    </ul>
</body>

</html>
